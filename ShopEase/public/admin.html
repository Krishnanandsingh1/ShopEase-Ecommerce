<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Admin dashboard | ShopEase</title><link rel="stylesheet" href="/css/style.css"></head><body><header class="nav" id="nav"></header><main class="container"><h1>Admin dashboard</h1><div id="message" hidden></div><div id="stats" class="stat-grid"></div><section class="panel"><h2>Add a product</h2><form id="productForm" class="grid"><div class="field"><label>Name</label><input name="name" required></div><div class="field"><label>Category</label><input name="category" required></div><div class="field"><label>Price (₹)</label><input name="price" type="number" min="1" step="0.01" required></div><div class="field"><label>Stock</label><input name="stock" type="number" min="0" required></div><div class="field"><label>Image URL</label><input name="image_url" type="url"></div><div class="field"><label>Description</label><input name="description"></div><div><button>Add product</button></div></form></section><section class="panel"><h2>Products</h2><div class="table-wrap"><table><thead><tr><th>Name</th><th>Price</th><th>Stock</th><th>Actions</th></tr></thead><tbody id="adminProducts"></tbody></table></div></section><section class="panel"><h2>Orders</h2><div class="table-wrap"><table><thead><tr><th>Order</th><th>Customer</th><th>Total</th><th>Status</th></tr></thead><tbody id="adminOrders"></tbody></table></div></section><section class="panel"><h2>Customers</h2><div class="table-wrap"><table><thead><tr><th>Name</th><th>Email</th><th>Joined</th></tr></thead><tbody id="customers"></tbody></table></div></section></main><footer class="footer">© 2026 ShopEase · Built as a full-stack portfolio project</footer><script src="/js/common.js"></script><script src="/js/admin.js"></script></body></html>
