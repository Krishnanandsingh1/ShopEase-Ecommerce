<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Checkout | ShopEase</title><link rel="stylesheet" href="/css/style.css"></head><body><header class="nav" id="nav"></header><main class="container"><form id="checkoutForm" class="form-card"><h1>Checkout</h1><p class="muted">Enter your delivery details.</p><div id="message" hidden></div><div class="field"><label for="address">Delivery address</label><textarea id="address" name="address" rows="4" required autocomplete="street-address"></textarea></div><div class="field"><label for="phone">Phone number</label><input id="phone" name="phone" type="tel" required maxlength="25" autocomplete="tel"></div><fieldset class="payment-options"><legend>Payment method</legend><label class="payment-option"><input type="radio" name="paymentMethod" value="Cash on Delivery" checked><span><strong>Cash on Delivery</strong><small>Pay when your order arrives</small></span></label><label class="payment-option"><input type="radio" name="paymentMethod" value="UPI (Demo)"><span><strong>UPI</strong><small>Demo only — no payment is processed</small></span></label><label class="payment-option"><input type="radio" name="paymentMethod" value="Card (Demo)"><span><strong>Credit or debit card</strong><small>Demo only — do not enter card details</small></span></label></fieldset><div class="delivery-note"><strong>Delivery tracking included</strong><span>Estimated delivery in 5 days. Follow order updates in My Orders.</span></div><p class="muted">Demo checkout: no real payment is collected.</p><button style="width:100%">Place order</button></form></main><footer class="footer">© 2026 ShopEase · Built as a full-stack portfolio project</footer><script src="/js/common.js"></script><script src="/js/checkout.js"></script></body></html>
